name:                scriptocreator-examples
version:             0.1.0.0
github:              "scriptocreator/scriptocreator-examples"
license:             BSD-3-Clause
author:              "Andrey Boyarkin"
maintainer:          "andrey.boyarkin1999@gmail.com"
copyright:           "2026 Andrey Boyarkin"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/scriptocreator-examples#readme>

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Scriptocreator.MayEither

executables:
  RussianWords:
    main:                Main.hs
    source-dirs:         app/RussianWords
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - scriptocreator-examples
    - mtl
    - text
  
  Fintech:
    main:                Main.hs
    source-dirs:         app/Fintech
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - scriptocreator-examples
    - text

  CategoryCount:
    main:                Main.hs
    source-dirs:         app/CategoryCount
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - scriptocreator-examples
    - text
    
  PatternMatching:
    main:                Main.hs
    source-dirs:         app/PatternMatching
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - scriptocreator-examples
    - containers
    - vector
    - extra

tests:
  scriptocreator-examples-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - scriptocreator-examples
